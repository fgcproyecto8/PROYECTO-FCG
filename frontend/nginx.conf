server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA con react-router-dom: las rutas que no son archivos reales
    # (p. ej. /canchas/5/editar) se resuelven con index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos de /assets/ llevan un hash en el nombre: se pueden
    # cachear sin riesgo. index.html no, para que cada deploy se vea.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
