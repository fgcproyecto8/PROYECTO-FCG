server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA con react-router-dom: cualquier ruta que no sea un archivo
    # real (p. ej. /canchas/5/editar) tiene que resolver a index.html
    # para que React Router la maneje en el cliente, no un 404 de Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
