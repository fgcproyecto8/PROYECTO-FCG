# Orquesta los 3 servicios de PartidoYa en producción: PostgreSQL,
# backend (Django + Gunicorn) y frontend (React compilado + Nginx).
#
# El desarrollo local NO usa este archivo: sigue siendo venv + SQLite
# (backend) y `npm run dev` (frontend), como hasta ahora.
#
# Variables sensibles (contraseñas, secret key) NO están acá: se leen
# de un archivo ".env" en esta misma carpeta (fuera del repositorio,
# ver .gitignore) a partir de ".env.example".

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
      # Se arma a partir de las mismas credenciales del servicio "db"
      # (host "db" = nombre del servicio en esta misma red de Compose),
      # para no tener que repetir usuario/contraseña en dos variables
      # distintas que podrían quedar desincronizadas.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      # Fotos de perfil e imágenes de cancha: tienen que sobrevivir a
      # que se recree el contenedor (a diferencia de los estáticos,
      # que se regeneran solos con collectstatic en cada arranque).
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/hola/')"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      # Puerto publicado en el host; no sabemos cómo el servidor de la
      # universidad enruta api.app6.academia.ar hacia este contenedor,
      # así que lo dejamos configurable (ver .env.example).
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres_data:
  media_data:
